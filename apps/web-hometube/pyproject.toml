[project]
name = "content-frontend"
version = "0.8.5"
description = "Content — Streamlit front-end (pure API client of the back-end)"
license = "FSL-1.1-ALv2"
authors = [{ name = "Yann Orieult" }]
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.40",
    "requests>=2.32",
]

# Not a package — run directly: `streamlit run app.py`. This file declares the
# runtime dependencies (installed explicitly in the Dockerfile).

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
