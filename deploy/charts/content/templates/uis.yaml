{{- /*
The three UIs (studio, console, hometube) are identical as far as deployment
is concerned: the same Streamlit base, port 8501, /_stcore/health probe. One
template covers them all — adding a surface is one entry in `uis` and nothing
else.
*/ -}}
{{- range $key, $ui := .Values.uis }}
{{- if $ui.enabled }}
{{- $fullname := printf "%s-%s" (include "content.fullname" $) $key }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "content.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $key }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "content.selectorLabelsBase" $ | nindent 6 }}
      app.kubernetes.io/component: {{ $key }}
  template:
    metadata:
      labels:
        {{- include "content.selectorLabelsBase" $ | nindent 8 }}
        app.kubernetes.io/component: {{ $key }}
    spec:
      containers:
        - name: {{ $key }}
          image: "{{ $ui.image.repository }}:{{ $ui.image.tag | default $.Chart.AppVersion }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8501
          env:
            - name: TZ
              value: {{ $.Values.config.TZ | quote }}
            # The API as seen by the POD (the Service's internal DNS name).
            - name: CONTENT_API_URL
              value: "http://{{ include "content.fullname" $ }}:{{ $.Values.service.port }}"
            # The API as seen by the visitor's BROWSER.
            - name: CONTENT_PUBLIC_API_URL
              value: {{ include "content.publicApiUrl" $ | quote }}
            {{- with $ui.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          readinessProbe:
            httpGet: {path: /_stcore/health, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /_stcore/health, port: http}
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 5
          resources: {{- toYaml $ui.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "content.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $key }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8501
      targetPort: http
  selector:
    {{- include "content.selectorLabelsBase" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $key }}
{{- if $ui.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "content.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $key }}
spec:
  ingressClassName: {{ $ui.ingress.className | default $.Values.ingress.className }}
  rules:
    {{- range prepend ($ui.ingress.extraHosts | default list) (include "content.uiHost" (dict "root" $ "key" $key "ui" $ui)) }}
    - host: {{ . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $fullname }}
                port: {name: http}
    {{- end }}
{{- end }}
---
{{- end }}
{{- end }}
