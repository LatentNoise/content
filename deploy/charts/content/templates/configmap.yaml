apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "content.fullname" . }}-config
  labels: {{- include "content.labels" . | nindent 4 }}
data:
  {{- /* .Values.config plus everything derived from `domain`, the bundled
         Ollama and the bundled speech service — see content.effectiveConfig. Empty keys are omitted,
         so an empty value in config means "derive it", never "set it empty". */}}
  {{- range $k, $v := (include "content.effectiveConfig" . | fromYaml) }}
  {{- if ne (toString $v) "" }}
  {{ $k }}: {{ toString $v | quote }}
  {{- end }}
  {{- end }}
