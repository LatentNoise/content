{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "content.fullname" . }}
  labels: {{- include "content.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    {{- /* One surface can answer on several names at once — a LAN name and a
           public one, or a name being migrated. Rewriting the Host in a proxy
           instead would make the application generate links for a hostname
           the visitor never typed. */}}
    {{- range prepend ((.Values.ingress).extraHosts | default list) .Values.ingress.host }}
    - host: {{ . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "content.fullname" $ }}
                port: {name: http}
    {{- end }}
{{- end }}
