# Default values for the Content chart.
#
# Do not edit this file for a deployment: pass your own -f or --set. This file
# documents what exists, and its hostnames are deliberately example.com
# placeholders — a public chart ships defaults, an operator ships their own
# file.

image:
  repository: ghcr.io/latentnoise/content
  # ⚠️ Always an explicit version tag, never `latest`: a mutable tag turns a
  # pod restart into an undecided deployment, and lets two replicas differ.
  # Empty means .Chart.appVersion.
  tag: ""
  pullPolicy: IfNotPresent

# One replica, and not provisionally: SQLite is both the source of truth and
# the job queue (ADR 0006), with local POSIX locks, and Litestream (backup)
# assumes a single writer. Parallelism is set with maxConcurrentJobs, not with
# replicas.
replicaCount: 1

# Recreate, never RollingUpdate: two pods on the same volume and the same
# database, even for a few seconds, is exactly what that ADR forbids.
strategy: Recreate

# Separating the API from the worker (ADR 0032).
#
# Same image, same code, one environment variable: with `worker.enabled`, the
# main deployment stops running jobs and answers requests only, while a second
# deployment does the heavy work. The API then never waits behind a transcode.
#
# ⛔ What this does NOT do: add CPU. Every pod on a node shares the same cores,
# so throughput is still set by maxConcurrentJobs. And every pod must stay on
# ONE node: the data volume is ReadWriteOnce and node-bound, and a SQLite file
# reached over a network share corrupts.
worker:
  enabled: false
  replicaCount: 1
  strategy: Recreate
  resources: {}

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 8000

# 🔑 The four surfaces live under ONE COMMON PARENT.
# Reason: a session cookie set on the parent domain is sent by the browser to
# ALL of its subdomains — that is what makes one sign-in work across the
# engine, Studio, the Console and HomeTube, without merging the applications
# or serving them under paths (ADR 0033).
ingress:
  enabled: true
  className: traefik
  host: api.content.example.com
  # Extra names the same surface also answers on: a LAN name beside a public
  # one, or a name being migrated. Rewriting the Host in a proxy instead would
  # make the application generate links for a hostname nobody typed.
  extraHosts: []
  annotations: {}
  tls:
    enabled: false
    secretName: ""

persistence:
  # /data: the SQLite database, jobs, artifacts, the analysis cache.
  data:
    enabled: true
    size: 5Gi
    storageClass: local-path
    accessMode: ReadWriteOnce
  # /output: the delivery library (ADR 0018).
  output:
    enabled: true
    size: 5Gi
    storageClass: local-path
    accessMode: ReadWriteOnce

# The engine's configuration. Empty keys are omitted from the ConfigMap.
config:
  TZ: UTC
  CONTENT_DATA_DIR: /data
  CONTENT_DB_PATH: /data/content.db
  CONTENT_DELIVERY_DIR: /output
  CONTENT_DELIVERY_DEFAULT: "true"
  # How the library is shared: "shared" (one for everyone), "per_owner" (one
  # inside each owner's own directory), or "off" (no server-side library —
  # delivery is refused and the user downloads instead). ADR 0018, revisited.
  # Empty = derived from CONTENT_AUTH_MODE, like the layout below: shared when
  # nobody signs in, per_owner when people do. Set "shared" explicitly for a
  # household that wants one library everyone reads.
  CONTENT_DELIVERY_SCOPE: ""
  # How owners are filed on disk (ADR 0037): "flat" for one owner, "per_user"
  # for a hosted instance. Empty = derived from CONTENT_AUTH_MODE.
  CONTENT_STORAGE_LAYOUT: ""
  CONTENT_MAX_CONCURRENT_JOBS: "2"
  CONTENT_STEP_TIMEOUT_SECONDS: "3600"
  CONTENT_ALLOW_PRIVATE_NETWORKS: "false"
  CONTENT_CACHE_ENABLED: "true"
  CONTENT_ANALYSIS_TTL_HOURS: "72"
  CONTENT_CORS_ORIGINS: ""
  # Signing in (ADR 0033). "none" = one implicit local user, the self-hosted
  # contract. "token" = the hosted door; do NOT switch it on before a mailer
  # is reachable, or nobody can sign in.
  CONTENT_AUTH_MODE: "none"
  CONTENT_PUBLIC_BASE_URL: ""
  # The PARENT domain, so one session is recognised by all four surfaces.
  CONTENT_SESSION_COOKIE_DOMAIN: ""
  CONTENT_SESSION_COOKIE_SECURE: "true"
  CONTENT_ALLOWED_REDIRECT_ORIGINS: ""
  # Where a sign-in lands when the link named no destination. Empty drops the
  # visitor on the engine, which serves API documentation.
  CONTENT_SIGN_IN_DEFAULT_TARGET: ""
  # Who may read facts about the machine (ADR 0035). Granted at sign-in;
  # unlisting never revokes it.
  CONTENT_OPERATOR_EMAILS: ""
  # Days a finished job's files are kept before an unattended sweep (ADR 0023).
  # "0" = never. It expires the artifacts, the sources and the job's tmp; the
  # job, its logs and its artifact rows stay, so the history is still
  # answerable. The delivery library is never swept.
  CONTENT_RETENTION_DAYS: "0"
  # Per-owner quotas (ADR 0036). "0" = unlimited; operators are never counted.
  # Media is minutes of SOURCE, checked before any work happens. Storage counts
  # artifacts, the delivery library and uploads — never the engine's own cache.
  CONTENT_QUOTA_MEDIA_MINUTES_PER_MONTH: "0"
  CONTENT_QUOTA_STORAGE_BYTES: "0"
  CONTENT_QUOTA_CONCURRENT_JOBS: "0"
  # The outbound-email service (ADR 0031), by service name inside the cluster.
  # Empty = the sign-in link is written to the log instead of being sent.
  CONTENT_MAILER_URL: ""
  # ⛔ CONTENT_MAILER_API_KEY belongs in the Secret, never here.
  # Summaries: the URL of an Ollama reachable from the cluster.
  # ⚠️ Empty = no summaries. See the README, "What is not wired up".
  CONTENT_OLLAMA_URL: ""
  CONTENT_OLLAMA_MODEL: ""
  # No cookie file is mounted in Kubernetes yet: this neutralises the
  # docker-compose default, which would point at a file that is not there.
  CONTENT_CREDENTIALS: ""

# A language model, bundled — only for the instance that has nowhere else to
# get one.
#
# Summaries, translations and derived chapters need an Ollama. Two situations:
#
#   - You already run one (a box with a GPU, a workstation, another cluster):
#     leave `enabled` false and set config.CONTENT_OLLAMA_URL to its address.
#     Nothing here is created, and your address is never overridden.
#   - You have nothing: set `enabled` true. The chart deploys Ollama, pulls the
#     model on first start, keeps the weights on a volume of their own, and
#     wires CONTENT_OLLAMA_URL to it — no other setting to touch.
#
# ⚠️ Sizing, because this is the one thing that can starve the engine. A 3-4B
# model quantised to Q4 holds in ~2.5 GiB and answers in seconds on CPU; an 8B
# doubles both. `requests` are not decoration here — without them the scheduler
# cannot protect the engine from the model.
ollama:
  enabled: false
  image:
    repository: ollama/ollama
    tag: "0.12.11"
    pullPolicy: IfNotPresent
  # Pulled on first start, in order. The FIRST one becomes
  # CONTENT_OLLAMA_MODEL unless config sets it explicitly.
  models:
    - qwen3:4b
  # How long the weights stay in RAM after the last request. "-1" keeps them
  # resident: on a quiet instance the default (5m) reloads gigabytes from disk
  # for every summary, which is the slowest part of the job.
  keepAlive: "-1"
  persistence:
    size: 20Gi
    storageClass: local-path
    accessMode: ReadWriteOnce
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: "3"
      memory: 6Gi
  extraEnv: []
  nodeSelector: {}
  tolerations: []

# Secrets (LLM API keys). The Secret is created OUTSIDE git:
#   kubectl -n content create secret generic content-secrets \
#     --from-literal=CONTENT_ANTHROPIC_API_KEY=...
existingSecret: ""

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    # ffmpeg and yt-dlp are bursty and hungry; size this to your node.
    cpu: "3"
    memory: 4Gi

# The entrypoint starts as root and drops to uid 1000 (su-exec) after taking
# ownership of /data and /output. Do not force runAsNonRoot: it would break
# that adoption.
podSecurityContext: {}
securityContext: {}

nodeSelector: {}
tolerations: []
affinity: {}

# The API URL as seen by the BROWSER, used by every UI for artifact download
# links.
publicApiUrl: http://api.content.example.com

# The three UIs. They are identical as far as deployment is concerned
# (Streamlit, port 8501): adding a surface is one entry here and nothing else.
#
# Each UI is automatically given the public URL of the OTHER enabled surfaces,
# as CONTENT_STUDIO_URL / CONTENT_CONSOLE_URL / CONTENT_HOMETUBE_URL.
# ⚠️ These variables are NOT read by the applications yet: the deployment is
# ready, the code is not.
# Each surface's `publicUrl` is the address a BROWSER reaches it at — the
# public name when there is one, the ingress host otherwise. The chart folds
# them into CONTENT_SURFACES on the engine (ADR 0038), which is how every
# surface learns where the others are and how the sign-in page names where it
# sends someone back. Empty = the surface is not offered to the others.
uis:
  studio:
    enabled: true
    image: {repository: ghcr.io/latentnoise/content-studio, tag: ""}
    publicUrl: http://studio.content.example.com
    ingress: {enabled: true, className: "", host: studio.content.example.com, extraHosts: []}
    resources:
      requests: {cpu: 50m, memory: 128Mi}
      limits: {cpu: 500m, memory: 512Mi}
    extraEnv: []
  console:
    enabled: true
    image: {repository: ghcr.io/latentnoise/content-console, tag: ""}
    publicUrl: http://console.content.example.com
    ingress: {enabled: true, className: "", host: console.content.example.com, extraHosts: []}
    resources:
      requests: {cpu: 50m, memory: 128Mi}
      limits: {cpu: 500m, memory: 512Mi}
    extraEnv: []
  hometube:
    enabled: true
    image: {repository: ghcr.io/latentnoise/content-hometube, tag: ""}
    publicUrl: http://hometube.content.example.com
    ingress: {enabled: true, className: "", host: hometube.content.example.com, extraHosts: []}
    resources:
      requests: {cpu: 50m, memory: 128Mi}
      limits: {cpu: 500m, memory: 512Mi}
    extraEnv: []

# ⚠️ Content does NOT expose a /metrics endpoint today, so this ServiceMonitor
# stays disabled until the application publishes one. Pod CPU and memory
# already reach Prometheus through cAdvisor and kube-state-metrics.
serviceMonitor:
  enabled: false
  interval: 30s
  path: /metrics
