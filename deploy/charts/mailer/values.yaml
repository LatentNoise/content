# Default values for the Mailer chart.
# Do not edit this file for a deployment: pass your own -f or --set.
# This file documents what exists.

image:
  repository: ghcr.io/latentnoise/mailer
  # Always an explicit version tag, never `latest`: a mutable tag turns a pod
  # restart into an undecided deployment.
  # Empty means .Chart.appVersion.
  tag: ""
  pullPolicy: IfNotPresent

# One replica, and not provisionally: SQLite is both the queue and the log,
# with local POSIX locks, on a node-bound volume.
replicaCount: 1

# Recreate, never RollingUpdate: two pods on the same SQLite file, even for a
# few seconds, is the one thing this storage model forbids.
strategy: Recreate

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 8000

# The mailer is called by other services. Expose it through an ingress only if
# a caller lives outside this cluster; in-cluster callers should use the
# service name, which never leaves the node.
ingress:
  enabled: false
  className: traefik
  host: mail.example.com
  annotations: {}
  tls:
    enabled: false
    secretName: ""

persistence:
  # /data holds the queue and the delivery log. Losing it loses messages that
  # were accepted but not yet sent.
  enabled: true
  size: 1Gi
  storageClass: local-path
  accessMode: ReadWriteOnce

# ⛔ Credentials are NEVER values. Create the secret out of band and name it
# here; the chart only references it.
#
#   kubectl create secret generic mailer-credentials \
#     --from-literal=MAILER_SMTP_HOST=… \
#     --from-literal=MAILER_SMTP_USER=… \
#     --from-literal=MAILER_SMTP_PASSWORD=… \
#     --from-literal=MAILER_API_KEYS='content:…,studio:…'
existingSecret: mailer-credentials

config:
  smtpSecurity: ssl
  smtpPort: "465"
  # The From address of every message this instance sends.
  defaultFrom: "Content <content@example.com>"
  maxAttempts: "5"
  retryBaseSeconds: "30"
  # Set to "true" on a staging instance so it can never mail a real person.
  dryRun: "false"

resources:
  requests:
    cpu: 20m
    memory: 64Mi
  limits:
    memory: 256Mi

podSecurityContext:
  fsGroup: 10001

securityContext:
  runAsNonRoot: true
  runAsUser: 10001
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]

nodeSelector: {}
tolerations: []
affinity: {}
