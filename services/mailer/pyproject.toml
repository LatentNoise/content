[project]
name = "latentnoise-mailer"
version = "0.1.1"
description = "One door for outbound email across LatentNoise products."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic[email]>=2.9",
]

[project.optional-dependencies]
# httpx2, not httpx: starlette's TestClient imports httpx2 first and only falls
# back to httpx with a StarletteDeprecationWarning -- and raises outright when
# neither is present. The suite reaches httpx solely through TestClient (nothing
# under tests/ imports it), so the fallback buys nothing and expires on the
# starlette release that drops it. Nothing in CI runs this suite, so that break
# would surface on whoever next touched the mailer.
test = ["pytest>=8.3", "pytest-asyncio>=0.24", "httpx2>=2"]
dev = ["ruff>=0.7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mailer*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# The second filter is the guard on the httpx2 test dependency above. It is not
# a DeprecationWarning subclass, so the first filter never covered it, and it
# arrives as a warning on a suite no CI job runs -- i.e. invisibly. Promoting it
# to an error means a lost httpx2 fails `make test-mailer` loudly instead.
filterwarnings = [
    "ignore::DeprecationWarning",
    "error::starlette.exceptions.StarletteDeprecationWarning",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
