name: 💡 Idea or feature request
description: Suggest something Content should do. Input is welcome; implementation is not promised.
labels: [idea]
body:
  - type: markdown
    attributes:
      value: |
        Ideas and feedback are genuinely useful — they shape the roadmap.

        One thing to set expectations honestly: opening this **does not mean it
        will be built**. Content follows a single-maintainer model (see
        CONTRIBUTING.md) — if you need the change now, forking is the intended
        path and the licence grants you that right.
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: >
        Describe the situation you are actually in, not the feature you have in
        mind. What are you doing, and where does Content get in the way?
    validations:
      required: true
  - type: textarea
    id: workaround
    attributes:
      label: What do you do today instead?
      description: A manual workaround, another tool, or nothing at all.
  - type: textarea
    id: idea
    attributes:
      label: What did you have in mind? (optional)
      description: >
        If you already have a shape in mind, describe it — but the problem above
        matters more, and a different solution may fit Content's model better.
