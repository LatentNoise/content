# The gate, run on a machine that is not the maintainer's.
#
# Triggers on pushes and tags, never on pull requests: contributions are not
# accepted (GOVERNANCE.md), so a PR-driven workflow would simply never fire.
#
# No secret is required. Every job here runs on a fork, on a clone, and on a
# first push, with nothing configured.
#
# Actions are pinned to a commit SHA rather than a moving tag: a public
# repository's CI is a supply-chain surface, and `@v4` is mutable.
name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # One supported version, done properly — not a matrix. uv fetches it, so the
  # runner's own Python is never what decides.
  UV_PYTHON: "3.13"
  FORCE_COLOR: "1"

jobs:
  validate:
    name: make validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      # The documented install path, exactly as a newcomer would run it. It has
      # never run anywhere but the maintainer's laptop; this is the proof.
      - name: make install
        run: make install

      # The official gate: format --check + lint + the hermetic suite across the
      # backend, the CLI, the MCP server, the SDK and the layering guard-rails.
      #
      # Deliberately no apt packages beforehand. The runner has no ffmpeg,
      # yt-dlp, Typst, poppler or Ollama, which is the point: "hermetic" has to
      # mean it runs on a bare machine. The handful of checks that need one of
      # those skip themselves rather than fail; which ones, and why that is
      # accepted, is written down in docs/development/validation.md.
      - name: make validate
        run: make validate

  test-ui:
    name: make test-ui
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      # Its own throwaway Streamlit venv, so it needs no `make install` first.
      # Hermetic all the same: a fake client stands in for the backend.
      - name: make test-ui
        run: make test-ui

  images:
    name: ${{ matrix.image }} (amd64 + arm64)
    # Only on tags: publishing is a deliberate act, and a tag is the one push
    # that is already deliberate. A branch push never reaches this job, so an
    # ordinary commit still cannot put anything in the registry.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [validate, test-ui]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write # GHCR, via GITHUB_TOKEN — no stored registry secret
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: content
            dockerfile: apps/backend/Dockerfile
          - image: content-hometube
            dockerfile: apps/web-hometube/Dockerfile
          - image: content-studio
            dockerfile: apps/web-studio/Dockerfile
          - image: content-console
            dockerfile: apps/web-admin/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags computed in the shell rather than with docker/metadata-action: it
      # is a dozen lines of `sed`, and it is one less third-party action to pin
      # and audit on a public repository. GHCR requires a lowercase path, and
      # the owner here is not (LatentNoise).
      - name: Compute image tags
        id: tags
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          repo="ghcr.io/$owner/$IMAGE"
          version="${GITHUB_REF_NAME#v}"          # v0.1.0 -> 0.1.0
          # Braces on every expansion: `$repo:latest` is a lowercase modifier
          # in zsh, so the unbraced form silently produces "contentatest".
          tags="${repo}:${version}"
          case "$version" in
            *-*)  # a pre-release (0.2.0-rc1) gets its exact tag and nothing else
              ;;
            *)
              major="${version%%.*}"
              minor="${version%.*}"
              tags="${tags},${repo}:${minor},${repo}:${major},${repo}:latest"
              ;;
          esac
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "Publishing: $tags"

      # The image is BUILT and RUN before anything is pushed, because a unit
      # test cannot see this class of defect: it lives in the shipped artifact,
      # not in the code. Between 0.5.0 and 0.6.3 the published backend image
      # could not boot at all — FastAPI needs python-multipart to *register*
      # the uploads route, the image did not have it, and `create_app()` raised
      # on start. `make validate` stayed green throughout, because the dev
      # environment installs the MCP server too, which happens to depend on
      # python-multipart. Constructing the app inside the real image is the
      # only check that would have caught it.
      #
      # amd64 only and `--load`: buildx cannot load a multi-arch manifest into
      # the local daemon, and the missing-dependency class is architecture
      # independent. The multi-arch build below reuses these layers from cache.
      - name: Build the image for a boot check
        if: matrix.image == 'content'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          load: true
          tags: boot-check:${{ github.sha }}
          provenance: false
          sbom: false

      - name: The app must actually build inside the image
        if: matrix.image == 'content'
        run: |
          set -euo pipefail
          docker run --rm boot-check:${{ github.sha }} \
            python3 -c "from content.api.app import create_app; create_app(); print('app builds')"

      # Both architectures are really compiled — the arm64 half is the one that
      # breaks, since it needs musl wheels — and now they are pushed as a single
      # multi-arch manifest, so `docker pull` picks the right one by itself.
      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          # provenance/sbom off: they add sha256-* refs beside every tag on
          # GHCR, which turns the package page into noise for no benefit here.
          provenance: false
          sbom: false
