# A draft release for every version tag — never a published one.
#
# Adapted from HomeTube's release workflow with the parts Content deliberately
# refuses taken out: HomeTube publishes GHCR images and a live release straight
# from the tag; here nothing is published at all. The draft gives the
# maintainer a skeleton (auto-generated notes are a bare commit list, since
# there are no pull requests to summarize) to rewrite and publish by hand —
# releasing stays a deliberate act, like pushing the tag itself
# (`make version-tag` creates it, pushing it is a separate decision).
#
# No third-party action: the runner's own `gh` with the workflow token does the
# whole job, so there is nothing to pin by SHA and no supply-chain surface
# beyond GitHub itself. Idempotent: if a release (draft or published) already
# exists for the tag, this does nothing.
#
# `workflow_dispatch` covers a tag pushed before this workflow existed:
# Actions → this workflow → Run, with the tag name as input.
name: Release draft

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to draft a release for (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  draft:
    name: Create the draft release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      # The tree is validated before anything is packaged: a draft whose
      # artifacts were built from a tree that fails its own gate is not a
      # skeleton, it is a trap. (`ci.yml` also runs on the tag, but this job
      # must not depend on having noticed another workflow's result.)
      - name: Validate the tree the tag points at
        run: |
          make install
          make validate

      # The installable artifacts, built here rather than by hand so they can
      # never be a stale copy of the source: the extension as a zip (a user
      # downloads one file instead of cloning the monorepo) and the SDK + CLI +
      # MCP wheels (until they are on PyPI, the release IS the index).
      - name: Package the browser extension
        run: make extension-zip

      - name: Build the SDK, CLI and MCP wheels
        run: make wheels

      # One checksum manifest for exactly the files attached below, so a
      # download can be verified without trusting the transport:
      #   shasum -a 256 -c SHA256SUMS.txt
      - name: Write the checksum manifest
        run: cd dist && shasum -a 256 *.zip *.whl > SHA256SUMS.txt && cat SHA256SUMS.txt

      # The draft's body comes from docs/releases/<tag>.md when the tree
      # carries one — authored release notes, written with the release and
      # reviewed like any other change — and only falls back to GitHub's
      # generated notes (a bare commit/PR list) when no file exists. Writing
      # the notes is part of preparing a release; the tag then publishes the
      # words that were reviewed with the code they describe.
      - name: Create draft release for the tag, with the artifacts attached
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --json isDraft >/dev/null 2>&1; then
            echo "A release already exists for $TAG — refreshing its artifacts only."
            gh release upload "$TAG" dist/*.zip dist/*.whl dist/SHA256SUMS.txt --clobber
            exit 0
          fi
          notes="docs/releases/$TAG.md"
          if [ -f "$notes" ]; then
            notes_args="--notes-file $notes"
          else
            echo "No $notes in the tree — falling back to generated notes."
            notes_args="--generate-notes"
          fi
          gh release create "$TAG" \
            --draft \
            --verify-tag \
            --title "Content $TAG" \
            $notes_args \
            dist/*.zip dist/*.whl dist/SHA256SUMS.txt
          echo "Draft created for $TAG — edit and publish it deliberately."
