# Content — multi-container deployment.
#
#   cp .env.example .env
#   docker compose up -d --build
#
# Four services. The engine (`content`) and the operations console (`console`)
# always run. The download UIs are chosen with one line in `.env` — no compose
# knowledge needed:
#
#   COMPOSE_PROFILES=hometube,studio   → both UIs (the .env.example default)
#   COMPOSE_PROFILES=hometube          → HomeTube only
#   COMPOSE_PROFILES=studio            → Content Studio only
#
# - content  : back-end API + embedded worker (ADR 0007), :8010
# - hometube : HomeTube — the YouTube UI, :8501
# - studio   : Content Studio — the full-contract UI, :8502
# - console  : Content Console — observe & pilot, :8503
# Data (SQLite DB, jobs, artifacts, analysis cache) persists in ./data.
services:
  content:
    # Published on each version tag; `docker compose pull` fetches it.
    image: ghcr.io/latentnoise/content:${CONTENT_VERSION:-latest}
    build:
      # Repo-root context so LICENSE/NOTICE ship inside the image,
      # matching the UI images.
      context: .
      dockerfile: apps/backend/Dockerfile
      args:
        # ⚠️ Do not set CONTENT_INSTALL_STT=true: the build fails. The image is
        # Alpine and faster-whisper's dependencies (ctranslate2, av) publish no
        # musl wheels — `ResolutionImpossible` (verified 2026-09-16). Transcription
        # runs in the speech service instead: `docker compose --profile speech`.
        INSTALL_STT: ${CONTENT_INSTALL_STT:-false}
    container_name: content
    environment:
      - TZ=${TZ:-Europe/Paris}
      - CONTENT_DATA_DIR=/data
      # Where a browser reaches each surface (ADR 0038): what lets every UI
      # offer the others, and the sign-in page name where it sends someone.
      - CONTENT_SURFACES=studio=http://localhost:${STUDIO_PORT:-8502},console=http://localhost:${CONSOLE_PORT:-8503},hometube=http://localhost:${HOMETUBE_PORT:-8501}
      - CONTENT_DB_PATH=/data/content.db
      - CONTENT_MAX_CONCURRENT_JOBS=${CONTENT_MAX_CONCURRENT_JOBS:-2}
      - CONTENT_STEP_TIMEOUT_SECONDS=${CONTENT_STEP_TIMEOUT_SECONDS:-3600}
      - CONTENT_ALLOW_PRIVATE_NETWORKS=${CONTENT_ALLOW_PRIVATE_NETWORKS:-false}
      # playground/input is the only root allowed for file sources.
      - CONTENT_ALLOWED_INPUT_ROOTS=/input
      # Delivery library: outputs are also dropped under /output/<folder>/<name>.
      - CONTENT_DELIVERY_DIR=/output
      # Deliver by default (ADR 0018): every artifact lands in the library
      # under its display name unless the request says otherwise
      # (delivery.mode: "none"). Off in the bare engine, on here.
      - CONTENT_DELIVERY_DEFAULT=${CONTENT_DELIVERY_DEFAULT:-true}
      # Storage roots + cache switch (docs/storage.md, ADR 0009). Enabled here:
      # the controlled HomeTube use case reuses the downloaded video across
      # content generations, and keeps the URL analysis JSON for 3 days.
      - CONTENT_CACHE_ENABLED=${CONTENT_CACHE_ENABLED:-true}
      - CONTENT_ANALYSIS_TTL_HOURS=${CONTENT_ANALYSIS_TTL_HOURS:-72}
      # LLM daemon on the host (summaries); empty model = first installed.
      # Cloud LLM summarizers (optional): a token enables Anthropic/OpenAI as a
      # text.summarize runner (privacy-aware). Secrets — pass via the shell/.env.
      - CONTENT_ANTHROPIC_API_KEY=${CONTENT_ANTHROPIC_API_KEY:-}
      - CONTENT_ANTHROPIC_MODEL=${CONTENT_ANTHROPIC_MODEL:-claude-sonnet-5}
      - CONTENT_OPENAI_API_KEY=${CONTENT_OPENAI_API_KEY:-}
      - CONTENT_OPENAI_MODEL=${CONTENT_OPENAI_MODEL:-gpt-4o-mini}
      - CONTENT_OLLAMA_URL=${CONTENT_OLLAMA_URL:-http://host.docker.internal:11434}
      - CONTENT_OLLAMA_MODEL=${CONTENT_OLLAMA_MODEL:-}
      - CONTENT_OLLAMA_MAX_CONTEXT=${CONTENT_OLLAMA_MAX_CONTEXT:-32768}
      # Speech-to-text model for an in-process faster-whisper. ⚠️ The published
      # image cannot carry it (Alpine: no musl wheels for ctranslate2/av), so on
      # a container install this does nothing — use the speech service below.
      - CONTENT_WHISPER_MODEL=${CONTENT_WHISPER_MODEL:-small}
      # Speech service (transcription from audio): empty = not used. With the
      # `speech` profile, set it to http://speech:8000. Private network only.
      - CONTENT_SPEECH_URL=${CONTENT_SPEECH_URL:-}
      - CONTENT_SPEECH_STT_MODEL=${CONTENT_SPEECH_STT_MODEL:-Systran/faster-whisper-small}
      - CONTENT_SPEECH_API_KEY=${CONTENT_SPEECH_API_KEY:-}
      # Language preferences (HomeTube parity): order audio tracks (VO first,
      # then primary, then secondaries) and seed default subtitles.
      - CONTENT_LANGUAGE_PRIMARY=${CONTENT_LANGUAGE_PRIMARY:-}
      - CONTENT_LANGUAGES_SECONDARIES=${CONTENT_LANGUAGES_SECONDARIES:-}
      - CONTENT_VO_FIRST=${CONTENT_VO_FIRST:-true}
      - CONTENT_LANGUAGE_PRIMARY_INCLUDED_IN_SUBTITLES=${CONTENT_LANGUAGE_PRIMARY_INCLUDED_IN_SUBTITLES:-true}
      # Cookies for authenticated sources: id=path pairs, container-side paths
      # (/config is the mounted ./config folder). Declared by default — the
      # UIs flag the missing file until the export is dropped in ./config.
      # `${VAR-default}` (no colon): an explicitly EMPTY value in .env turns
      # the feature off, only an unset variable gets the default.
      - CONTENT_CREDENTIALS=${CONTENT_CREDENTIALS-youtube=/config/youtube_cookies.txt}
      # Browser cross-origin access (empty = none; curl/SDK never need it).
      - CONTENT_CORS_ORIGINS=${CONTENT_CORS_ORIGINS:-}
      # Signing in (ADR 0033). `none` is one implicit local user and no door;
      # `token` needs a public base URL and a reachable mailer, which is why
      # they travel together. Compose used to forward NONE of these, so an
      # operator who followed .env.example and set CONTENT_AUTH_MODE=token got
      # a healthy stack that was still wide open — the variable reached nobody.
      - CONTENT_AUTH_MODE=${CONTENT_AUTH_MODE:-}
      - CONTENT_PUBLIC_BASE_URL=${CONTENT_PUBLIC_BASE_URL:-}
      - CONTENT_SESSION_COOKIE_DOMAIN=${CONTENT_SESSION_COOKIE_DOMAIN:-}
      # ⚠️ Explicit default, unlike the empty ones above: the engine reads this
      # through _to_bool, where an EMPTY string is False rather than "unset".
      # `${VAR:-}` would silently ship insecure cookies.
      - CONTENT_SESSION_COOKIE_SECURE=${CONTENT_SESSION_COOKIE_SECURE:-true}
      - CONTENT_SESSION_TTL_HOURS=${CONTENT_SESSION_TTL_HOURS:-}
      - CONTENT_SIGN_IN_DEFAULT_TARGET=${CONTENT_SIGN_IN_DEFAULT_TARGET:-}
      - CONTENT_ALLOWED_REDIRECT_ORIGINS=${CONTENT_ALLOWED_REDIRECT_ORIGINS:-}
      - CONTENT_MAGIC_LINK_TTL_MINUTES=${CONTENT_MAGIC_LINK_TTL_MINUTES:-}
      - CONTENT_MAGIC_LINK_MAX_PER_HOUR=${CONTENT_MAGIC_LINK_MAX_PER_HOUR:-}
      # Who may operate this installation (ADR 0035).
      - CONTENT_OPERATOR_EMAILS=${CONTENT_OPERATOR_EMAILS:-}
      # The outbound-email service (ADR 0031). Empty = the sign-in link is
      # written to the log instead, which is what self-hosting does.
      - CONTENT_MAILER_URL=${CONTENT_MAILER_URL:-}
      - CONTENT_MAILER_API_KEY=${CONTENT_MAILER_API_KEY:-}
      # How the library and the data tree are shared between users (ADR 0018).
      # Both default from CONTENT_AUTH_MODE when left empty.
      - CONTENT_DELIVERY_SCOPE=${CONTENT_DELIVERY_SCOPE:-}
      - CONTENT_STORAGE_LAYOUT=${CONTENT_STORAGE_LAYOUT:-}
      # Uploads from a client machine: the one endpoint that writes to the
      # engine's disk, so it is bounded.
      - CONTENT_MAX_UPLOAD_BYTES=${CONTENT_MAX_UPLOAD_BYTES:-}
      - CONTENT_UPLOADS_TOTAL_BYTES=${CONTENT_UPLOADS_TOTAL_BYTES:-}
      - CONTENT_UPLOAD_TTL_HOURS=${CONTENT_UPLOAD_TTL_HOURS:-}
      # Per-owner quotas; 0 (the default) is unlimited, which is self-hosting.
      - CONTENT_QUOTA_MEDIA_MINUTES_PER_MONTH=${CONTENT_QUOTA_MEDIA_MINUTES_PER_MONTH:-}
      - CONTENT_QUOTA_STORAGE_BYTES=${CONTENT_QUOTA_STORAGE_BYTES:-}
      - CONTENT_QUOTA_CONCURRENT_JOBS=${CONTENT_QUOTA_CONCURRENT_JOBS:-}
      # What a refused person is offered. Every value empty on a self-hosted
      # instance, which has no offer to make and must not pretend otherwise.
      - CONTENT_QUOTA_WALL_SELF_HOST_COMMAND=${CONTENT_QUOTA_WALL_SELF_HOST_COMMAND:-}
      - CONTENT_QUOTA_WALL_DOCS_URL=${CONTENT_QUOTA_WALL_DOCS_URL:-}
      - CONTENT_QUOTA_WALL_CTA_LABEL=${CONTENT_QUOTA_WALL_CTA_LABEL:-}
      - CONTENT_QUOTA_WALL_CTA_URL=${CONTENT_QUOTA_WALL_CTA_URL:-}
      # How long artifacts survive; 0 (the default) never purges.
      - CONTENT_RETENTION_DAYS=${CONTENT_RETENTION_DAYS:-}
      # Members of one collection processed at once.
      - CONTENT_COLLECTION_MEMBER_CONCURRENCY=${CONTENT_COLLECTION_MEMBER_CONCURRENCY:-}
      # Warn when the installed yt-dlp is older than N days; 0 = never.
      - CONTENT_YTDLP_MAX_AGE_DAYS=${CONTENT_YTDLP_MAX_AGE_DAYS:-}
      # ⚠️ Explicit default like the cookie flag, for the opposite reason: this
      # one is read with a two-argument getenv, so an empty value is KEPT and
      # would blank the source link the licence requires a fork to carry.
      - CONTENT_SOURCE_URL=${CONTENT_SOURCE_URL:-https://github.com/LatentNoise/content}
      # Update checking: empty = the engine never phones anywhere.
      - CONTENT_RELEASE_CHECK_URL=${CONTENT_RELEASE_CHECK_URL:-}
      - CONTENT_RELEASE_PAGE_URL=${CONTENT_RELEASE_PAGE_URL:-}
      - CONTENT_RELEASE_CHECK_TTL_HOURS=${CONTENT_RELEASE_CHECK_TTL_HOURS:-}
      # ⚠️ Explicit default (boolean, as above): empty would stop the embedded
      # worker and the engine would accept jobs it never runs.
      - CONTENT_WORKER_ENABLED=${CONTENT_WORKER_ENABLED:-true}
    ports:
      - "${CONTENT_PORT:-8010}:8000"
    volumes:
      - ./data:/data
      - ./playground/input:/input:ro
      # Delivered files land here, browsable on the host (HomeTube-style library).
      # Host path is configurable (CONTENT_DELIVERY_DIR_HOST) so you point it at
      # your own media library; its sub-folders become the UI's destinations.
      - ${CONTENT_DELIVERY_DIR_HOST:-./playground/output}:/output
      # External runtime files (config/README.md): cookies, custom fonts…
      # Drop a file in ./config on the host, reference it as /config/<name>.
      # e.g. ./config/youtube_cookies.txt +
      #   CONTENT_CREDENTIALS=youtube=/config/youtube_cookies.txt  (in .env)
      # Read-only is fine: the engine copies cookie jars before use.
      - ./config:/config:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 5

  # HomeTube — the YouTube UI. Runs when "hometube" is in COMPOSE_PROFILES.
  hometube:
    profiles: ["hometube"]
    image: ghcr.io/latentnoise/content-hometube:${CONTENT_VERSION:-latest}
    build:
      # Repo-root context so the shared content-sdk package is available.
      context: .
      dockerfile: apps/web-hometube/Dockerfile
    container_name: content-hometube
    environment:
      - TZ=${TZ:-Europe/Paris}
      # Internal URL (compose network) for the front-end's own requests.
      - CONTENT_API_URL=http://content:8000
      # Public URL (host) for the browser's artifact download links.
      - CONTENT_PUBLIC_API_URL=http://localhost:${CONTENT_PORT:-8010}
      # The language the interface speaks (en|fr); each visitor may
      # still pick their own in the sidebar.
      - CONTENT_UI_LANGUAGE=${CONTENT_UI_LANGUAGE:-en}
    ports:
      - "${HOMETUBE_PORT:-8501}:8501"
    depends_on:
      content:
        condition: service_healthy
    restart: unless-stopped

  # Content Studio — the full contract. Runs when "studio" is in
  # COMPOSE_PROFILES.
  studio:
    profiles: ["studio"]
    image: ghcr.io/latentnoise/content-studio:${CONTENT_VERSION:-latest}
    build:
      context: .
      dockerfile: apps/web-studio/Dockerfile
    container_name: content-studio
    environment:
      - TZ=${TZ:-Europe/Paris}
      - CONTENT_API_URL=http://content:8000
      - CONTENT_PUBLIC_API_URL=http://localhost:${CONTENT_PORT:-8010}
    ports:
      - "${STUDIO_PORT:-8502}:8501"
    depends_on:
      content:
        condition: service_healthy
    restart: unless-stopped

  # A language model, only if you want one and have nowhere else to get it.
  #
  #   docker compose --profile llm up -d
  #
  # Summaries, translations and derived chapters need an Ollama. Three honest
  # situations, and only the third starts this container:
  #
  #   1. You do not want them. Change nothing; those outputs are reported as
  #      unavailable up front, never discovered half-way through a job.
  #   2. You already run Ollama — on this host, on a box with a GPU, anywhere.
  #      Change nothing either: CONTENT_OLLAMA_URL already defaults to the
  #      host's own daemon, and you can point it anywhere in .env.
  #   3. You have nothing and want summaries out of the box: run the command
  #      above, and set CONTENT_OLLAMA_URL=http://ollama:11434 in .env so the
  #      engine calls this container instead of the host.
  #
  # ⚠️ Not started by default on purpose: the image plus one small model is a
  # multi-gigabyte download and a resident process, which would triple the cost
  # of "Docker Compose is the only prerequisite" for everyone who does not need
  # it.
  ollama:
    image: ollama/ollama:${OLLAMA_VERSION:-0.12.11}
    container_name: content-ollama
    profiles: ["llm"]
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      # Keep the weights resident between requests: the default (5m) reloads
      # gigabytes from disk before every summary on a quiet instance.
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:--1}
    # `ollama serve` has to be running before `ollama pull` can work, so the
    # container starts the server, waits for it, pulls the model, and hands the
    # process back. The pull is idempotent: on later starts the weights are
    # already in the volume and it returns at once.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        /bin/ollama serve &
        pid=$$!
        until /bin/ollama list >/dev/null 2>&1; do sleep 1; done
        /bin/ollama pull "$${OLLAMA_MODEL:-qwen3:4b}"
        wait $$pid
    volumes:
      - ./data/ollama:/root/.ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # Speech — transcription and text-to-speech in one container, only if you
  # want them and have nowhere else to get them.
  #
  #   docker compose --profile speech up -d
  #
  # Transcribing audio needs a speech service: the engine image cannot carry
  # faster-whisper (it is Alpine, and ctranslate2/av have no musl wheels). Two
  # situations:
  #
  #   1. You do not want transcription from audio. Change nothing; it is
  #      reported as unavailable up front, never discovered half-way through.
  #   2. You want it: run the command above, and set
  #      CONTENT_SPEECH_URL=http://speech:8000 in .env so the engine calls it.
  #      Any other server that speaks the OpenAI audio API works too — as long
  #      as it is on a private network: the engine never sends audio elsewhere.
  #
  # The same server speaks text-to-speech (Kokoro). The engine does not use
  # that half yet; the model is downloaded so the service is ready when it does.
  #
  # ⚠️ Not started by default: ~1 GB of image and models. Idle it holds ~420 MiB;
  # a loaded Whisper adds ~1 GiB, released after SPEECH_MODEL_TTL seconds.
  speech:
    image: ghcr.io/speaches-ai/speaches:${SPEECH_VERSION:-0.9.0-rc.3-cpu}
    container_name: content-speech
    profiles: ["speech"]
    environment:
      - PRELOAD_MODELS=["Systran/faster-whisper-small","speaches-ai/Kokoro-82M-v1.0-ONNX"]
      - STT_MODEL_TTL=${SPEECH_MODEL_TTL:-300}
      - TTS_MODEL_TTL=${SPEECH_MODEL_TTL:-300}
      - WHISPER__COMPUTE_TYPE=int8
      - ENABLE_UI=false
      - LOG_LEVEL=info
    volumes:
      # A named volume, not ./data/speech: the image runs as uid 1000, and a
      # bind-mounted directory Docker creates is root's — the first model
      # download would fail with a PermissionError.
      - speech-models:/home/ubuntu/.cache/huggingface/hub
    ports:
      # Loopback only: the engine reaches it as http://speech:8000 on the
      # compose network. The port is published for a local check, never the LAN.
      - "127.0.0.1:${SPEECH_PORT:-18000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      # A first start downloads the models before the server listens.
      start_period: 600s
    restart: unless-stopped

  # Content Console — observe & pilot the backend. Always on, whichever
  # download UI is chosen: it is how an operator sees jobs, configuration,
  # storage and logs. It creates no downloads.
  console:
    image: ghcr.io/latentnoise/content-console:${CONTENT_VERSION:-latest}
    build:
      context: .
      dockerfile: apps/web-admin/Dockerfile
    container_name: content-console
    environment:
      - TZ=${TZ:-Europe/Paris}
      - CONTENT_API_URL=http://content:8000
      - CONTENT_PUBLIC_API_URL=http://localhost:${CONTENT_PORT:-8010}
    ports:
      - "${CONSOLE_PORT:-8503}:8501"
    depends_on:
      content:
        condition: service_healthy
    restart: unless-stopped

volumes:
  speech-models:
